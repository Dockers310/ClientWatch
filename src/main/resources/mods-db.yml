# Это НЕ читы и НЕ срабатывания: такие моды попадают только в профиль игрока (меню модов, история заходов),
# по ним можно поставить отметку вниманием (⭐). Проверяются при входе и при ручной проверке.
# Отключить: detection.scan-known-mods: false в config.yml.
