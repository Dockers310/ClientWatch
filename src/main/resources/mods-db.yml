  # ShieldFixes (walksy.shieldfixes): в jar НЕТ ни одного lang-файла и ни одной клавиши
  # (только миксины на рендер/логику щита) - строкой перевода или keybind-ом этот способ
  # его не находит. Единственная зацепка - общая библиотека WalksyLib, но она не регистрирует
  # ничего специфичного для ShieldFixes, отличить от ShieldStatus/других её модов так нельзя.
  # Если понадобится точное определение - надо смотреть, регистрирует ли WalksyLib сетевой
  # канал (тогда его поймает профиль по каналам, см. profile.known-channels), иначе никак.

  # Combat Hitboxes (me.sootysplash.box, id combat-hitboxes): аналогично, в jar нет lang-файла
